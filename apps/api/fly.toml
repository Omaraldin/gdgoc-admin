# fly.toml — GDGoC Admin API
# Deploy from apps/api/ with: fly deploy
# Set secrets with:  fly secrets set KEY=value ...

app            = 'gdgoc-admin-api'
primary_region = 'sin'

# ── Build ──────────────────────────────────────────────────────────────────────
[build]
  dockerfile = "Dockerfile"

# ── Non-secret environment variables ──────────────────────────────────────────
# Secrets (DATABASE_URL, SESSION_SECRET, KAYAN_*, STORAGE_*, SMTP_*) must be
# set via `fly secrets set` — never put them here.
[env]
  APP_ENV     = "production"
  SERVER_PORT = "8080"

# ── HTTP service ───────────────────────────────────────────────────────────────
[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["app"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 1000
    soft_limit = 800

  # Health check — Fiber responds with {"status":"ok"} on this path
  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/api/v1/health"
    timeout      = "5s"

# ── VM sizing ──────────────────────────────────────────────────────────────────
[[vm]]
  size      = "shared-cpu-1x"
  memory    = "256mb"
  processes = ["app"]
