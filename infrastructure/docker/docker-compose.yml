version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gdgoc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdgoc
      POSTGRES_PASSWORD: gdgoc_secret
      POSTGRES_DB: gdgoc_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gdgoc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: gdgoc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gdgoc_minio
      MINIO_ROOT_PASSWORD: gdgoc_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: gdgoc_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
